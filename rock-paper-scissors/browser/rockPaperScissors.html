<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSS only -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx" crossorigin="anonymous">    <title>RPS Grand Championship</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container text-center" id="contain">
        <div class="row justify-content-center mt-5">
            <div class="col-auto">
                <h1 class="mb-3">Rock Paper Scissors Grand Championship!</h1>
                <hr>
            </div>
            
        </div>
        
        <div class="row justify-content-center my-5" id="register">
            <div class="col-auto">  
                <h2>Register Now!</h2>
                <div class="input-group input-group-lg my-5">
                    <span class="input-group-text" id="inputGroup-sizing-lg">Player:</span>
                    <input type="text" id="playerName" class="form-control" aria-label="Sizing example input" aria-describedby="inputGroup-sizing-lg">
                </div>
                <button type="button" class="btn btn-primary btn-lg" onclick="startGame()">Begin Game</button>
            </div>
        </div>
        
    </div>
<!-- JavaScript Bundle with Popper -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js" integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa" crossorigin="anonymous"></script>
<script src="interactive.js"></script>
</body>
</html>
